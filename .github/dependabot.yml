version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    ignore:
      # typescript-eslint (via eslint-config-next) doesn't support TypeScript 7 yet, and ESLint 10
      # crashes eslint-plugin-react. Both broke CI on Oct 6. Lift these once eslint-config-next supports them.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      next:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
